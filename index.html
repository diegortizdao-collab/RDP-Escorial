<script>
/* ============ CONSTANTES ============ */
const TODAY=new Date('2026-11-17T12:00:00');
const MES=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const PASOS=['Selección','Clarificar','Desglosar','Objetivo','Causa raíz','Contramedidas','Implementar','Monitorear','Estandarizar'];
const FASE=p=>p<=5?'P':p===6?'D':p===7?'C':'A';
const FC={P:'#2E9BD6',D:'#F28C28',C:'#22A06B',A:'#8E4EC6'};
const FN={P:'Planificar',D:'Hacer',C:'Verificar',A:'Actuar'};
const HC={'A3':'#0F5C8C','A4':'#2E9BD6','5PQ':'#F28C28'};
const HN={'A3':'A3','A4':'A4','5PQ':'5 Porqués'};
const PLANTAS=['Suipacha','25 de Mayo','Ambas','Sin planta'];
/* Estructura: Gerencia > Área > Sector ('' = sin sector). La planta es un dato aparte de cada RDP. */
const ORG={
 'Industrial':{'UET 1':['Cocinas','Prearmado'],'UET 2':['Welding','Enlozado','Gema'],'UET 3':['Corte','Estampado'],'UET 4':['Armado Gas','Armado Eléctrico','Calefones','Soldadura'],'UET 5':['Pintura','Prensa'],'Mantenimiento 25 de Mayo':[''],'Mantenimiento Suipacha':[''],'Moldes y Matrices':[''],'Mejora Continua':['']},
 'Calidad, Seguridad, Higiene y Medio Ambiente':{'Aseguramiento de Calidad':[''],'Seguridad, Higiene y Medio Ambiente':['']},
 'Supply Chain':{'Logística':['Expedición'],'Almacén':[''],'Compras':[''],'Programación y Control de Producción':['']},
 'RRHH, Administración y Sistemas':{'Sistemas':[''],'Recursos Humanos':['']},
 'Ventas':{'Ventas':['']},'Post Venta':{'Servicio Post Venta':['']}
};
const PL_AREA={'UET 1':'25 de Mayo','UET 2':'25 de Mayo','UET 3':'25 de Mayo','UET 4':'Suipacha','UET 5':'Suipacha','Mantenimiento 25 de Mayo':'25 de Mayo','Mantenimiento Suipacha':'Suipacha'};
const locTxt=l=>l.planta+' · '+l.area+(l.sector?' · '+l.sector:'');
const TIT={'Soldadura':'Scrap por soldadura defectuosa','Prensa':'Paradas por cambio de matriz','Pintura':'Rechazos por piel de naranja','Enlozado':'Defectos de enlozado en piezas','Cocinas':'Reclamos por puerta desalineada','Armado Gas':'Retrabajo por pérdida en conexión','Armado Eléctrico':'Fallas en prueba eléctrica','Calefones':'Rechazos en prueba de estanqueidad','Corte':'Desperdicio de chapa en corte','Estampado':'Rebabas en piezas estampadas','Welding':'Soldadura incompleta en bastidor','Gema':'Variación de espesor de recubrimiento','Prearmado':'Faltantes de componentes en kit','Matricería':'Desgaste prematuro de matrices','Mantenimiento':'Paradas no planificadas por falla eléctrica','Almacén':'Diferencias de inventario en almacén','Expedición':'Errores de preparación de despacho','Compras':'Demoras de entrega de proveedores','Aseguramiento de Calidad':'Rechazos de proveedor en recepción','Sistemas':'Caídas del sistema de planificación','Recursos Humanos':'Ausentismo no programado','Ventas':'Errores en carga de pedidos','Servicio Post Venta':'Demora en entrega de repuestos','Moldes y Matrices':'Tiempo de reparación de matrices','Mantenimiento 25 de Mayo':'Paradas por falla de máquina','Mantenimiento Suipacha':'Paradas por falla de máquina'};
const IND=[{u:'% scrap',b:4.8,m:1.5},{u:'min parada/turno',b:38,m:12},{u:'% rechazo',b:6.5,m:2},{u:'reclamos/mes',b:9,m:2},{u:'% retrabajo',b:7,m:2.5}];
const ORIG=['Indicador','Pareto','Impacto (seguridad/cliente)','Genba','Reclamo de cliente'];
const LIDER=['Líder de UET','Téc. de Calidad','Supervisor de turno','Ing. de Procesos','Jefe de sector'];
const CRS=['Falta de estándar de cambio','Herramental sin criterio de recambio','Sin control de detección en el puesto','Método de trabajo no estandarizado','Variación de materia prima'];
const AC={cont:['Inspección 100% de la característica','Segregar y rotular material sospechoso','Verificación reforzada al inicio de turno'],
 cm:['Rediseñar dispositivo de posicionamiento','Incorporar calibre pasa/no pasa','Actualizar frecuencia de recambio de herramental','Capacitar al personal en el nuevo método','Instalar sensor de detección','Ajustar parámetros de proceso y validar'],
 est:['Actualizar hoja de trabajo estandarizado','Actualizar plan de control / lista de verificación'],
 yok:['Replicar en líneas similares (Yokoten)','Compartir lecciones aprendidas en reunión de UET']};
const _s=(a,f)=>a.reduce((t,x)=>t+f(x),0);
const D=x=>new Date(x+'T12:00:00');
/* Matriz de costos (valores de ejemplo tomados de la pantalla "Valores" de Kaizenio; la oficial la define Escorial) */
const MAT=[
 {id:1,concepto:'Aluminio',unidad:'Kg',fuente:'Control de Gestión',v:[{desde:D('2026-07-01'),costo:5553},{desde:D('2026-01-01'),costo:4720}]},
 {id:2,concepto:'Chapa',unidad:'Kg',fuente:'Control de Gestión',v:[{desde:D('2026-07-01'),costo:1384},{desde:D('2026-01-01'),costo:1190}]},
 {id:3,concepto:'Mano de Obra Directa',unidad:'Hs',fuente:'Control de Gestión',v:[{desde:D('2026-01-01'),costo:7650}]},
 {id:4,concepto:'Mano de Obra Indirecta',unidad:'Hs',fuente:'Control de Gestión',v:[{desde:D('2026-01-01'),costo:15778}]},
 {id:5,concepto:'Recambio de Producto',unidad:'U',fuente:'Post Venta',v:[{desde:D('2026-01-01'),costo:350000}]},
 {id:6,concepto:'Servicio Técnico',unidad:'U',fuente:'Post Venta',v:[{desde:D('2026-01-01'),costo:60000}]}];
const LIBRES=[{c:'Energía eléctrica',u:'kWh',costo:180},{c:'Horas de inspección extra',u:'Hs',costo:9200},{c:'Flete de retrabajo',u:'Viaje',costo:85000},{c:'Horas extra de supervisión',u:'Hs',costo:14500}];
const costoAt=(c,d)=>(c.v.find(x=>x.desde<=d)||c.v[c.v.length-1]).costo;
const vigente=c=>c.v[0];
const MUDAS=['Defectos','Esperar','Movimientos','Traslados','Sobreproducción','Sobreproceso','Inventario','Ambiente','Seguridad'];
const MUDAP=['Defectos','Defectos','Defectos','Defectos','Esperar','Esperar','Movimientos','Traslados','Sobreproceso','Sobreproceso','Inventario','Sobreproducción','Seguridad','Ambiente'];
const MC=['#E5484D','#F28C28','#F2A93B','#2E9BD6','#8E4EC6','#0F5C8C','#22A06B','#5BB4E5','#98A2B3'];
const AREAS=['Administración','Almacén','Calidad Central','Comercial','Comex','Compras','Ingeniería e Innovación','Ingeniería de Producto','Inyección y Mecanizado','Logística','Mantenimiento Central','Mantenimiento Edilicio','Marketing','Mejora Continua','Planificación','Post Venta','Producto','Producto Comercial','Proyectos','Recursos Humanos','Seguridad Patrimonial','Seguridad, Higiene y Medio Ambiente','Sistemas','Supply Chain','UET 1','UET 2','UET 3','UET 4','UET 5'];
const USERS=[['Camila','Ferraro','Mejora Continua','Administrador'],['Tomás','Beltrán','Mejora Continua','Administrador'],['Lucía','Montenegro','UET 5','Usuario'],['Julián','Sosa','UET 4','Usuario'],['Agustina','Paredes','Calidad Central','Usuario'],['Nicolás','Vidal','UET 2','Usuario'],['Romina','Acosta','Mantenimiento Central','Usuario'],['Federico','Luna','UET 1','Usuario'],['Valeria','Cabrera','Seguridad, Higiene y Medio Ambiente','Usuario'],['Matías','Ibarra','UET 3','Usuario'],['Sofía','Herrera','Ingeniería de Producto','Usuario'],['Gonzalo','Peralta','Logística','Usuario']].map(([n,a,ar,ro])=>({n,a,ar,ro,e:(n[0]+a).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ /g,'')+'@escorial.com.ar'}));
function recalc(r){r.P0=_s(r.lines,l=>l.antes*l.costo);r.ahorroProy=r.P0*(1-r.meta/r.base);r.ahorroReal=r.medido?r.P0*(1-r.actual/r.base):0;}
const TIPOC={'Contención':'#F28C28','Contramedida':'#2E9BD6','Estandarización':'#8E4EC6','Yokoten':'#22A06B'};
const ESTC={'Cerrada':'#22A06B','En curso':'#2E9BD6','Planificada':'#98A2B3','Vencida':'#E5484D'};

/* ============ DATOS DE DEMOSTRACIÓN (simulados) ============ */
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(20261117);const pick=(a,r=R)=>a[Math.floor(r()*a.length)];const btw=(a,b,r=R)=>a+r()*(b-a);
const addD=(d,n)=>new Date(d.getTime()+n*864e5);
const SECT=[];for(const g in ORG)for(const u in ORG[g])for(const s of ORG[g][u])SECT.push({ger:g,area:u,sector:s});
const RDPS=[];
(function(){
 const W=[2,2,2,2,3,3,4,4,5];const tot=W.reduce((a,b)=>a+b,0);
 for(let i=0;i<30;i++){
  const loc0=pick(SECT),loc={...loc0,planta:PL_AREA[loc0.area]||pick(['Ambas','Suipacha','25 de Mayo','Sin planta'])};const x=R();const herr=x<.35?'5PQ':x<.75?'A4':'A3';
  let y=R()*tot,paso=0;for(let k=0;k<W.length;k++){y-=W[k];if(y<=0){paso=k;break}}
  const durF={'5PQ':.5,'A4':1,'A3':1.8}[herr];
  const inicio=addD(TODAY,-(20+paso*22*durF+R()*30));
  const ind=pick(IND);const base=ind.b*btw(.8,1.25),meta=ind.m*btw(.8,1.2);
  const kL=1+Math.floor(R()*2.4),target=btw(8e6,120e6);
  const lines=Array.from({length:kL},()=>{const std=R()<.75;const c=std?pick(MAT):null,L=std?null:pick(LIBRES);const costo=std?costoAt(c,inicio):L.costo;
   return {mode:std?'std':'libre',cid:std?c.id:null,concepto:std?c.concepto:L.c,unidad:std?c.unidad:L.u,costo,antes:Math.max(1,Math.round(target/kL/costo)),fuente:std?'Matriz de costos':'Costo indirecto estimado'}});
  const P0=_s(lines,l=>l.antes*l.costo);
  const costo=Math.round(P0*btw(.02,.12)*(herr==='A3'?1.6:1)/1000)*1000;
  const frac=[0,0,0,0,0,0,0,.7,.97][paso]*btw(.85,1.08);
  const actual=base-Math.min(1.05,frac)*(base-meta);
  const medido=paso>=7;

function desgInfo(r){

 niv.forEach((L,i)=>{const items=(L.items||[]).map(x=>({n:String(x.n||''),c:+x.c||0}));const sum=items.reduce((a,x)=>a+x.c,0);

  lv.push({i,dim:L.dim||'',items,sum,tot,eff,sel:L.sel});tot=eff!=null?items[eff].c:0});
 const path=lv.filter(l=>l.eff!=null&&l.items[l.eff].n&&l.items[l.eff].c>0).map(l=>({dim:l.dim,n:l.items[l.eff].n,c:l.items[l.eff].c,tot:l.tot}));
 const last=path[path.length-1],pct=last&&total?last.c/total*100:0,un=d.un||'';
 const pp=path.length?path.map(p=>p.n).join(' › ')+' — '+fq(last.c)+(total?' de '+fq(total):'')+' '+un+(total?' ('+pct.toFixed(0)+' % del problema)':''):'';

/* ============ CALCULADORA (cantidades medidas si existen) ============ */
function calcCard(r){
 const meas=r.lines.length&&r.lines.every(l=>l.desp!=null),k=r.actual/(r.base||1);
 const ln=r.lines.map(l=>{const a=l.antes*l.costo;const dq=!r.medido?null:meas?l.desp:l.antes*k;return {l,a,dq,d:dq==null?null:dq*l.costo}});
 const antes=_s(ln,x=>x.a),desR=r.medido?_s(ln,x=>x.d):null;
 const std=_s(r.lines.filter(l=>l.mode==='std'),l=>l.antes*l.costo)/(antes||1)*100;
 const pay=r.ahorroReal>0?r.costo/r.ahorroReal*12:null;
 const nt=!r.medido?['','El ahorro realizado se calcula al llegar al paso 7 (Monitorear), con la medición del indicador.']:r.ahorroReal>r.costo?['ok','Se recupera la inversión de '+fmtK(r.costo)+' en '+pay.toFixed(1).replace('.',',')+' meses.']:['w','Todavía no se recupera la inversión de '+fmtK(r.costo)+'.'];
 return `<div class="card"><h3>Calculadora de impacto · antes y después <small>valores anualizados</small><button class="btn alt" style="margin-left:auto" onclick="openPL('${r.id}')">+ Pérdida</button></h3>
 <div class="cols2"><div class="tw"><table><thead><tr><th>Tipo</th><th>Concepto</th><th>Un.</th><th class="r">Pérd. unit.</th><th class="r">Cant. antes</th><th class="r">Antes</th><th class="r">Cant. después</th><th class="r">Después</th><th class="r">Ahorro</th><th></th></tr></thead><tbody>
 ${ln.map(({l,a,dq,d},ix)=>`<tr><td>${tag(l.mode==='std'?'Estándar':'Libre',l.mode==='std'?'#2E9BD6':'#F28C28')}</td><td title="${esc2(l.mode==='std'?'Matriz de costos':l.fuente)}">${l.concepto}${calcHTML(l)}</td><td>${l.unidad}</td><td class="r nw">${fmtUS(l.costo)}</td><td class="r">${fv(l.antes)}</td><td class="r nw">${fmtK(a)}</td><td class="r">${dq!=null?fv(dq):'—'}</td><td class="r nw">${d!=null?fmtK(d):'—'}</td><td class="r nw"><b>${d!=null?fmtK(a-d):'—'}</b></td><td class="nw r">${plBtns(r.id,ix)}</td></tr>`).join('')||'<tr><td colspan="10" class="mut">Todavía no cargaste pérdidas.</td></tr>'}
 </tbody><tfoot><tr class="tfoot"><td colspan="5" class="r">Total</td><td class="r nw">${fmtK(antes)}</td><td></td><td class="r nw">${desR!==null?fmtK(desR):'—'}</td><td class="r nw">${desR!==null?fmtK(antes-desR):'—'}</td><td></td></tr></tfoot></table>
 <div class="note ${nt[0]}">${nt[1]}</div>
 <div class="note">${std.toFixed(0)}% de la pérdida base proviene de valores estándar de la matriz; el resto son conceptos libres (p. ej. costos indirectos).${meas?' Las cantidades «después» son valores medidos.':''}</div></div>
 <div><div class="ch" style="height:260px"><canvas id="c8"></canvas></div></div></div></div>`;
}
function drawBA(r){
 const meas=r.lines.length&&r.lines.every(l=>l.desp!=null),k=r.actual/(r.base||1);
 const antes=_s(r.lines,l=>l.antes*l.costo),L=['Antes','Meta'],V=[antes,antes*r.meta/(r.base||1)],C=['#E5484D','#2E9BD6'];
 if(r.medido){L.splice(1,0,'Después (real)');V.splice(1,0,meas?_s(r.lines,l=>l.desp*l.costo):antes*k);C.splice(1,0,'#22A06B')}
 mk('c8',{type:'bar',data:{labels:L,datasets:[{data:V,backgroundColor:C,borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fmtK(c.raw)}}},scales:{y:{beginAtZero:true,ticks:{callback:v=>fmtK(v)}}}}});
}

async function plSave(){
 const c=MAT.find(x=>x.id==PL.cid),ed=PL.ei!=null;

 if(!(cantF>0))return toast('Cargá una cantidad mayor a 0');
 if(PL.det&&PL.f.some(f=>f.v===''||!(+f.v>=0)))return toast('Completá el valor de cada factor');
 if(!PL.std&&(!PL.concepto.trim()||!(PL.costo>0)))return toast('Completá concepto y pérdida unitaria');
 if(!PL.std&&!PL.fuente.trim())return toast('Indicá el criterio de cálculo de la pérdida libre');
 const desp=PL.desp===''||PL.desp==null?null:+PL.desp;
 const l=PL.std?{mode:'std',cid:c.id,concepto:c.concepto,unidad:c.unidad,costo:plCost(),antes:cantF,desp:null,fuente:'Matriz de costos'}:{mode:'libre',cid:null,concepto:PL.concepto.trim(),unidad:PL.unidad||'U',costo:+PL.costo,antes:cantF,desp:null,fuente:PL.fuente};
 l.calc=PL.det?{base:+PL.base||0,factores:PL.f.map(f=>({e:f.e,v:+f.v,t:f.t==='%'?'%':'x'})),nota:PL.nota}:{base:null,factores:[],nota:''};
 try{
  if(ed){
   const old=plLine(PL.tgt,PL.ei);
   if(PL.tgt==='p0'){P0.lines[PL.ei]={...l,desp:null}}
   else if(LIVE){const b={cant_antes:l.antes,cant_despues:desp,motivo:PL.motivo,calculo:l.calc};
    if(l.mode==='std')b.matriz_id=l.cid;else Object.assign(b,{concepto:l.concepto,unidad:l.unidad,costo_unit:l.costo,fuente:l.fuente});
    putRdp(await api('PATCH','/perdidas/'+old.id,b))}
   else{const r=RDPS.find(x=>x.id===PL.tgt);r.lines[PL.ei]={...l,id:old.id,desp};recalc(r)}
   closeModal();toast('Pérdida actualizada');render();return}
  if(PL.tgt==='p0')P0.lines.push(l);
  else if(LIVE)putRdp(await api('POST','/rdp/'+PL.tgt+'/perdidas',{modo:l.mode,matriz_id:l.cid,concepto:l.concepto,unidad:l.unidad,costo_unit:l.costo,cant_antes:l.antes,fuente:l.fuente,calculo:l.calc}));
  else{const r=RDPS.find(x=>x.id===PL.tgt);r.lines.push(l);recalc(r)}
  closeModal();toast('Pérdida cargada');render();
 }catch(e){toast(e.message)}
}

 }catch(e){toast(e.message)}
}

function whoHTML(){return LIVE?`<div class="who">${AVH(UI.me.email,'',1)}<span>${uname(UI.me.email)} · ${UI.rol}</span><button class="btn ghost" onclick="logout()">Salir</button></div>`:`<div class="who"><span>Ver como</span><select onchange="UI.rol=this.value;render()">${['Administrador','Usuario'].map(x=>`<option ${UI.rol===x?'selected':''}>${x}</option>`).join('')}</select></div>`}
RDPS.forEach(r=>{r.pasos={};r.meds=[];if(r.paso>=1)r.pasos[1]={que:r.titulo,donde:(r.loc.sector?r.loc.sector+' · ':'')+r.loc.area+' ('+r.loc.planta+')'}});

/* ============ PASO 0 ============ */
const TOOLS=[{k:'5PQ',n:'5 Porqués (PDCA simple)',f:'FR-MCO-035',t:'≈ 1–2 semanas',d:'Causa probable conocida, un solo sector, problema simple. Una o dos cadenas de 5 Porqués con validación de resultados.',e:'Sin mejoras → se escala a A4/A3 conservando los datos.'},
 {k:'A4',n:'A4',f:'FR-MCO-004',t:'≈ 6 semanas',d:'Problema simple a intermedio con causas por desglosar (Ishikawa + 5PQ). Un equipo, ciclo corto, formato del Desafío RDP.',e:'Mejora parcial → reformular el 5PQ o escalar a A3.'},
 {k:'A3',n:'A3',f:'FR-MCO-010',t:'≈ 3 meses',d:'Problema crónico, multicausal o transversal, con inversión o impacto alto. Los 8 pasos completos con desglose DG / PP / PO y monitoreo.',e:'Es el formato completo para dirección.'}];
function recTool(){const s=P0.causa+P0.alc+P0.inv+P0.cro;return {s,k:s<=1?'5PQ':s<=3?'A4':'A3'}}
function renderP0(){
 const rec=recTool(),tot=P0.s.reduce((a,b)=>a+b,0),sel=P0.tool||rec.k;
 const gers=Object.keys(ORG);if(!ORG[F0.ger])F0.ger=gers[0]||'';const areas=Object.keys(ORG[F0.ger]||{});if(!areas.includes(F0.area))F0.area=areas[0]||'';const secs=((ORG[F0.ger]||{})[F0.area]||[]).filter(x=>x);if(F0.sector&&!secs.includes(F0.sector))F0.sector='';if(!F0.planta||!PLANTAS.includes(F0.planta))F0.planta=PLANTAS[0]||'';
 if(!F0.lider&&USERS.length)F0.lider=(LIVE&&UI.me?UI.me.email:USERS[0].e);
 const so=(k,list)=>`<select onchange="P0.${k}=this.value;renderP0()">${list.map(([v,l])=>`<option value="${v}" ${String(P0[k])===String(v)?'selected':''}>${l}</option>`).join('')}</select>`;
 const yn=k=>so(k,[['Sí','Sí'],['No','No']]);
 const crit=['Seguridad · ¿afecta a las personas?','Severidad · ¿afecta al cliente?','Cantidad · ¿está en el Pareto?','Recurrencia · ¿sucede continuamente?'];
 const orig={'Indicador':['Nombre del indicador','Valor actual','Meta'],'Pareto':['Categoría del Pareto','% del total','Período'],'Impacto (seguridad/cliente)':['Tipo de impacto','Descripción','Evidencia'],'Genba':['Sector observado','Hallazgo','Fecha de la recorrida'],'Reclamo de cliente':['N° de reclamo','Cliente','Cantidad']};
 const kz=P0.exs==='No'?['w','Sin estándar no hay punto de comparación: primero hay que crear uno (paso 1C). Esto todavía no es un RDP.']:P0.cum==='No'?['w','Existe el estándar pero no se cumple: el incumplimiento es parte del problema. Se puede avanzar, registrándolo en el paso 1.']:P0.est==='No'?['w','El proceso no es estable: conviene estabilizarlo antes de aplicar RDP (el Kaizen solo ocurre sobre procesos estables).']:['ok','Hay estándar, se cumple y el proceso es estable: el problema es candidato a RDP.'];
 $('#view').innerHTML=`
 ${BAN(`<b>Muestra del Paso 0.</b> Los campos son orientativos; en la versión real se guardan en la base y alimentan el RDP.`)}
 <div class="card"><h3>Paso 0 · Selección y priorización del problema</h3>
  <div class="form"><div class="f2"><label class="lab">Problema (título)</label><input type="text" placeholder="Ej.: scrap en línea X" value="${esc2(F0.titulo)}" oninput="F0.titulo=this.value"></div>
  <div class="f2"><label class="lab">Gerencia</label><select onchange="F0.ger=this.value;F0.area='';F0.sector='';renderP0()">${gers.map(x=>`<option ${x===F0.ger?'selected':''}>${x}</option>`).join('')}</select></div>
  <div class="f2"><label class="lab">Área</label><select onchange="F0.area=this.value;F0.sector='';renderP0()">${areas.map(x=>`<option ${x===F0.area?'selected':''}>${x}</option>`).join('')}</select></div>
  <div class="f2"><label class="lab">Sector <small class="mut">(opcional)</small></label><select onchange="F0.sector=this.value"><option value="">— sin sector —</option>${secs.map(x=>`<option ${x===F0.sector?'selected':''}>${x}</option>`).join('')}</select></div>
  <div class="f2"><label class="lab">Planta</label><select onchange="F0.planta=this.value">${PLANTAS.map(x=>`<option ${x===F0.planta?'selected':''}>${x}</option>`).join('')}</select></div>
  <div class="f2"><label class="lab">Líder del RDP</label><select onchange="F0.lider=this.value">${USERS.map(u=>`<option value="${u.e}" ${u.e===F0.lider?'selected':''}>${u.n} ${u.a}</option>`).join('')}</select></div>
  <div class="f2" style="grid-column:1/-1"><label class="lab">Equipo (opcional, se verá en el encabezado del problema)</label><div>${(F0.equipo||[]).length?eqChips(F0.equipo):'<span class="mut">Sin miembros.</span>'} <button class="btn ghost" style="padding:2px 9px" onclick="openEquipo('new')">+ Equipo</button></div></div>
  <div class="f2"><label class="lab">Tipo de pérdida (muda)</label><select onchange="F0.muda=this.value">${MUDAS.map(m=>`<option ${m===F0.muda?'selected':''}>${m}</option>`).join('')}</select></div></div>
  <div class="form" style="margin-top:10px"><div class="f2"><label class="lab">Indicador (unidad)</label><input type="text" placeholder="% scrap, min parada/turno…" value="${esc2(F0.unidad)}" oninput="F0.unidad=this.value"></div>
  <div class="f2"><label class="lab">Línea base</label><input type="number" step="any" value="${F0.base}" oninput="F0.base=this.value"></div>
  <div class="f2"><label class="lab">Meta</label><input type="number" step="any" value="${F0.meta}" oninput="F0.meta=this.value"></div></div></div>
 <div class="card"><h3>¿De dónde viene el problema? <small>origen y dato de respaldo</small></h3>
  <div class="form"><div class="f2"><label class="lab">Origen</label>${so('orig',ORIG.map(x=>[x,x]))}</div>
  ${(orig[P0.orig]||[]).map(l=>`<div class="f2"><label class="lab">${l}</label><input type="text" value="${esc2(F0.det[l]||'')}" oninput="F0.det['${l}']=this.value"></div>`).join('')}
  </div>
  <div style="margin-top:12px" class="form"><div class="f2"><label class="lab">¿Existe un estándar?</label>${yn('exs')}</div><div class="f2"><label class="lab">¿Se sigue?</label>${yn('cum')}</div><div class="f2"><label class="lab">¿Proceso estable?</label>${yn('est')}</div></div>
  <div class="note ${kz[0]}">${kz[1]}</div></div>
 <div class="card"><h3>Pérdida anual estimada <small>el valor «antes» que se compara al cierre</small><button class="btn alt" style="margin-left:auto" onclick="openPL('p0')">+ Pérdida</button></h3>
  <div class="tw"><table><thead><tr><th>Tipo</th><th>Concepto</th><th>Un.</th><th class="r">Pérdida unitaria</th><th class="r">Cantidad anual</th><th class="r">Pérdida total</th><th></th></tr></thead><tbody>${P0.lines.map((l,ix)=>`<tr><td>${tag(l.mode==='std'?'Estándar':'Libre',l.mode==='std'?'#2E9BD6':'#F28C28')}</td><td>${l.concepto}${calcHTML(l)}</td><td>${l.unidad}</td><td class="r">${fmtUS(l.costo)}</td><td class="r">${fv(l.antes)}</td><td class="r"><b>${fmtUS(l.antes*l.costo)}</b></td><td class="nw r">${plBtns('p0',ix)}</td></tr>`).join('')||'<tr><td colspan="7" class="mut">Todavía no cargaste pérdidas.</td></tr>'}</tbody><tfoot><tr class="tfoot"><td colspan="5" class="r">Pérdida anual total</td><td class="r">${fmtUS(_s(P0.lines,l=>l.antes*l.costo))}</td><td></td></tr></tfoot></table></div>
  <div class="note">Usá <b>valores estándar</b> de la matriz de costos o un <b>concepto libre</b> (p. ej. costos indirectos que la matriz no contempla). Los libres quedan marcados como tales en el cálculo.</div></div>
 <div class="card"><h3>Priorización <small>criterios del taller de RDP · decide el equipo por consenso</small></h3>
  <div class="form">${crit.map((c,i)=>`<div class="f2"><label class="lab">${c}</label><select onchange="P0.s[${i}]=+this.value;renderP0()">${[1,2,3,4,5].map(v=>`<option ${P0.s[i]===v?'selected':''}>${v}</option>`).join('')}</select></div>`).join('')}
  <div class="f2"><label class="lab">Puntaje total</label><div class="tot">${tot} <span class="mut" style="font-size:14px">/ 20</span></div><div class="pb" style="height:10px"><div style="width:${tot/20*100}%;background:${tot>=15?'#E5484D':tot>=10?'#F2A93B':'#2E9BD6'}"></div></div></div></div></div>
 <div class="card"><h3>Elegí el modelo de resolución de problemas <small>la recomendación es una guía: la decisión es tuya</small></h3>
  <div class="form" style="margin-bottom:12px"><div class="f2"><label class="lab">Causa raíz</label>${so('causa',[[0,'Conocida / probable'],[1,'A investigar'],[2,'Multicausal / desconocida']])}</div>
  <div class="f2"><label class="lab">Alcance</label>${so('alc',[[0,'Un sector'],[1,'Un área'],[2,'Varias áreas, gerencias o plantas']])}</div>
  <div class="f2"><label class="lab">¿Requiere inversión?</label>${so('inv',[[0,'No'],[1,'Sí']])}</div>
  <div class="f2"><label class="lab">Antigüedad</label>${so('cro',[[0,'Puntual / reciente'],[1,'Crónico / recurrente']])}</div></div>
  <div class="tools">${TOOLS.map(t=>`<div class="tool ${sel===t.k?'sel':''}" onclick="P0.tool='${t.k}';renderP0()">${rec.k===t.k?'<span class="rec">★ Recomendado</span>':''}<h4>${t.n}</h4><div>${tag(t.f,HC[t.k])} <span class="mut">${t.t} (referencia)</span></div><p>${t.d}</p><p class="mut"><i>${t.e}</i></p></div>`).join('')}</div>
  <div class="note">Complejidad ${rec.s}/6 → se recomienda <b>${HN[rec.k]}</b>. Elegiste <b>${HN[sel]}</b>.</div>
  ${sel!==rec.k?`<div class="f2" style="margin-top:10px"><label class="lab">Elegiste distinto de lo recomendado: ¿por qué?</label><textarea rows="2" placeholder="Justificación (queda registrada en el RDP)" oninput="P0.just=this.value">${P0.just}</textarea></div>`:''}
  <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap"><button class="btn" onclick="createRdp()">Crear RDP</button><button class="btn ghost" onclick="toast('En la muestra no se guardan datos')">Guardar borrador</button></div></div>`;
}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}

/* ============ NAVEGACIÓN ============ */
function render(){
 const T=[['dash','Dashboard'],['ficha','Ficha del RDP'],['p0','Nuevo RDP · Paso 0']];if(UI.rol==='Administrador')T.push(['adm','Administración']);
 if(UI.tab==='adm'&&UI.rol!=='Administrador')UI.tab='dash';
 $('#tabs').innerHTML=T.map(([k,l])=>`<button class="${UI.tab===k?'on':''}" onclick="UI.tab='${k}';render()">${l}</button>`).join('')+whoHTML();
 UI.tab==='dash'?renderDash():UI.tab==='ficha'?renderFicha():UI.tab==='p0'?renderP0():renderAdm();
}
boot();
</script>
</body>
</html>
