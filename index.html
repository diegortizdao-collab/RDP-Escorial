<style>

body{margin:0;background:var(--bg);color:var(--ink);font-family:Segoe UI,Roboto,Helvetica,Arial,sans-serif;font-size:14px}

h1{margin:2px 0 2px;font-size:24px;color:var(--navy)}.lead{color:var(--mut);font-size:13px}
.hdr .logos{margin-left:auto}.hdr .logos img{height:34px;display:block}

.banner{background:#FFF4E5;border:1px solid #F5D9A8;color:#7A4A00;border-radius:10px;padding:8px 14px;font-size:12.5px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(11,37,69,.05)}
.card h3{margin:0 0 10px;font-size:15px;color:var(--navy);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 small{font-weight:400;color:var(--mut);font-size:12px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.f{display:flex;flex-direction:column;gap:3px;min-width:128px;flex:1 1 128px;max-width:200px}
.f label,.lab{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}
select,input[type=text],input[type=number],textarea{width:100%;padding:7px 9px;border:1px solid #C5D2E0;border-radius:8px;background:#fff;font:inherit;color:var(--ink)}
select:focus,input:focus,textarea:focus{outline:2px solid var(--sky2);border-color:var(--sky)}

.flowwrap{overflow-x:auto}

.fbr{border-radius:8px 8px 0 0;color:#fff;font-weight:700;font-size:12px;text-align:center;padding:5px 4px}
.fc{text-align:center;cursor:pointer;border-radius:10px;padding:6px 4px 8px;border:2px solid transparent}
.fc:hover{background:#F3F8FC}.fc.sel{border-color:var(--navy);background:#F3F8FC}
.fc .n{font-size:22px;font-weight:800}.fc .bw{height:96px;display:flex;align-items:flex-end;justify-content:center}.fc .bw div{width:70%;border-radius:6px 6px 0 0;min-height:3px}

table{width:100%;border-collapse:collapse;font-size:13px}

tbody tr.rw{cursor:pointer}tbody tr.rw:hover td{background:#F3F8FC}
.tw{overflow-x:auto}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;color:#fff;white-space:nowrap}
.steps{display:inline-flex;gap:2px;vertical-align:middle}.steps i{width:11px;height:11px;border-radius:3px;background:#E3EAF1;display:block}
.steps i.done{opacity:1}.steps i.cur{outline:2px solid var(--ink);outline-offset:1px}
.pb{height:8px;background:#E3EAF1;border-radius:5px;overflow:hidden;min-width:70px}.pb div{height:100%;border-radius:5px}
.mut{color:var(--mut)}.r{text-align:right}.nw{white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:#E3F1FA;color:var(--navy);font-weight:700;font-size:12px;border-radius:12px;padding:3px 10px;cursor:pointer}
/* ficha */
.big{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin:8px 0 4px}
.bs{border-radius:8px;padding:8px 4px;text-align:center;font-size:11.5px;font-weight:700;background:#EEF2F6;color:var(--mut);border:2px solid transparent}
.bs b{display:block;font-size:16px}
.bs.done{color:#fff}.bs.cur{color:#fff;border-color:var(--ink);box-shadow:0 0 0 2px #fff inset}
.bandrow{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}.bandrow div{text-align:center;font-size:11px;font-weight:700;color:#fff;padding:2px;border-radius:6px 6px 0 0}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:900px){.cols2{grid-template-columns:1fr}}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kv div{background:#F5F9FC;border:1px solid var(--line);border-radius:10px;padding:8px 10px}.kv small{display:block;color:var(--mut);font-size:11px;font-weight:700;text-transform:uppercase}.kv b{font-size:17px}
/* paso 0 */
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.tool{position:relative;border:2px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;background:#fff}
.tool:hover{border-color:var(--sky2)}.tool.sel{border-color:var(--navy);background:#F3F8FC;box-shadow:0 0 0 3px #CFE6F6}
.tool h4{margin:0 0 4px;font-size:18px;color:var(--navy)}.tool p{margin:4px 0;font-size:12.5px;color:#344054}
.tool .rec{position:absolute;right:10px;top:-10px;background:var(--orange);color:#fff;font-size:11px;font-weight:800;padding:3px 10px;border-radius:10px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.f2{display:flex;flex-direction:column;gap:3px}
.note{border-left:4px solid var(--sky);background:#F3F8FC;padding:8px 12px;border-radius:6px;font-size:13px;margin-top:10px}
.note.w{border-color:var(--orange);background:#FFF4E5}.note.ok{border-color:var(--ok);background:#EAF8F1}
.tot{font-size:26px;font-weight:800;color:var(--navy)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-weight:600;display:none;z-index:9}
#modal{position:fixed;inset:0;background:rgba(11,37,69,.5);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#modal .box{background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:20px 22px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
#modal .x{float:right;border:0;background:transparent;font-size:22px;cursor:pointer;color:var(--mut)}
.sw{display:flex;align-items:center;gap:8px;cursor:pointer}.sw input{width:18px;height:18px}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;padding-bottom:6px}.who span{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase}.who select{width:auto}
.av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--sky),var(--navy));color:#fff;font-weight:800;display:inline-flex;align-items:center;justify-content:center;font-size:12px;flex:none}
.sub{display:flex;gap:8px;margin-bottom:12px}.sub button{border:1px solid #C5D2E0;background:#fff;border-radius:18px;padding:6px 16px;font:inherit;font-weight:700;color:var(--navy);cursor:pointer}.sub button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.mail{border:1px solid var(--line);border-radius:10px;background:#F8FAFC;padding:14px;font-size:13px}.mail hr{border:0;border-top:1px solid var(--line);margin:8px 0}
.tfoot td{font-weight:800;background:#F0F6FB}
.rowh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.rowh .sp{margin-left:auto}
footer{text-align:center;color:var(--mut);font-size:12px;padding:6px 0 22px}
</style>

<script>
/* ============ CONSTANTES ============ */
const TODAY=new Date('2026-11-17T12:00:00');
const MES=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const PASOS=['Selección','Clarificar','Desglosar','Objetivo','Causa raíz','Contramedidas','Implementar','Monitorear','Estandarizar'];
const FASE=p=>p<=5?'P':p===6?'D':p===7?'C':'A';
const FC={P:'#2E9BD6',D:'#F28C28',C:'#22A06B',A:'#8E4EC6'};
const FN={P:'Planificar',D:'Hacer',C:'Verificar',A:'Actuar'};
const HC={'A3':'#0F5C8C','A4':'#2E9BD6','5PQ':'#F28C28'};
const HN={'A3':'A3','A4':'A4','5PQ':'5 Porqués'};
const ORG={
 'Suipacha':{'UET 4':['Armado Gas','Armado Eléctrico','Calefones','Soldadura'],'UET 5':['Pintura','Prensa'],'Matricería':['Matricería'],'Mantenimiento':['Mantenimiento']},
 '25 de Mayo':{'UET 1':['Cocinas','Prearmado'],'UET 2':['Welding','Enlozado','Gema'],'UET 3':['Corte','Estampado'],'Matricería':['Matricería'],'Mantenimiento':['Mantenimiento']}
};
const TIT={'Soldadura':'Scrap por soldadura defectuosa','Prensa':'Paradas por cambio de matriz','Pintura':'Rechazos por piel de naranja','Enlozado':'Defectos de enlozado en piezas','Cocinas':'Reclamos por puerta desalineada','Armado Gas':'Retrabajo por pérdida en conexión','Armado Eléctrico':'Fallas en prueba eléctrica','Calefones':'Rechazos en prueba de estanqueidad','Corte':'Desperdicio de chapa en corte','Estampado':'Rebabas en piezas estampadas','Welding':'Soldadura incompleta en bastidor','Gema':'Variación de espesor de recubrimiento','Prearmado':'Faltantes de componentes en kit','Matricería':'Desgaste prematuro de matrices','Mantenimiento':'Paradas no planificadas por falla eléctrica'};
const IND=[{u:'% scrap',b:4.8,m:1.5},{u:'min parada/turno',b:38,m:12},{u:'% rechazo',b:6.5,m:2},{u:'reclamos/mes',b:9,m:2},{u:'% retrabajo',b:7,m:2.5}];
const ORIG=['Indicador','Pareto','Impacto (seguridad/cliente)','Genba','Reclamo de cliente'];
const LIDER=['Líder de UET','Téc. de Calidad','Supervisor de turno','Ing. de Procesos','Jefe de sector'];
const CRS=['Falta de estándar de cambio','Herramental sin criterio de recambio','Sin control de detección en el puesto','Método de trabajo no estandarizado','Variación de materia prima'];
const AC={cont:['Inspección 100% de la característica','Segregar y rotular material sospechoso','Verificación reforzada al inicio de turno'],
 cm:['Rediseñar dispositivo de posicionamiento','Incorporar calibre pasa/no pasa','Actualizar frecuencia de recambio de herramental','Capacitar al personal en el nuevo método','Instalar sensor de detección','Ajustar parámetros de proceso y validar'],
 est:['Actualizar hoja de trabajo estandarizado','Actualizar plan de control / lista de verificación'],
 yok:['Replicar en líneas similares (Yokoten)','Compartir lecciones aprendidas en reunión de UET']};
const _s=(a,f)=>a.reduce((t,x)=>t+f(x),0);
const D=x=>new Date(x+'T12:00:00');
/* Matriz de costos (valores de ejemplo tomados de la pantalla "Valores" de Kaizenio; la oficial la define Escorial) */
const MAT=[
 {id:1,concepto:'Aluminio',unidad:'Kg',fuente:'Control de Gestión',v:[{desde:D('2026-07-01'),costo:5553},{desde:D('2026-01-01'),costo:4720}]},
 {id:2,concepto:'Chapa',unidad:'Kg',fuente:'Control de Gestión',v:[{desde:D('2026-07-01'),costo:1384},{desde:D('2026-01-01'),costo:1190}]},
 {id:3,concepto:'Mano de Obra Directa',unidad:'Hs',fuente:'Control de Gestión',v:[{desde:D('2026-01-01'),costo:7650}]},
 {id:4,concepto:'Mano de Obra Indirecta',unidad:'Hs',fuente:'Control de Gestión',v:[{desde:D('2026-01-01'),costo:15778}]},
 {id:5,concepto:'Recambio de Producto',unidad:'U',fuente:'Post Venta',v:[{desde:D('2026-01-01'),costo:350000}]},
 {id:6,concepto:'Servicio Técnico',unidad:'U',fuente:'Post Venta',v:[{desde:D('2026-01-01'),costo:60000}]}];
const LIBRES=[{c:'Energía eléctrica',u:'kWh',costo:180},{c:'Horas de inspección extra',u:'Hs',costo:9200},{c:'Flete de retrabajo',u:'Viaje',costo:85000},{c:'Horas extra de supervisión',u:'Hs',costo:14500}];
const costoAt=(c,d)=>(c.v.find(x=>x.desde<=d)||c.v[c.v.length-1]).costo;
const vigente=c=>c.v[0];
const MUDAS=['Defectos','Esperar','Movimientos','Traslados','Sobreproducción','Sobreproceso','Inventario','Ambiente','Seguridad'];
const MUDAP=['Defectos','Defectos','Defectos','Defectos','Esperar','Esperar','Movimientos','Traslados','Sobreproceso','Sobreproceso','Inventario','Sobreproducción','Seguridad','Ambiente'];
const MC=['#E5484D','#F28C28','#F2A93B','#2E9BD6','#8E4EC6','#0F5C8C','#22A06B','#5BB4E5','#98A2B3'];
const AREAS=['Administración','Almacén','Calidad Central','Comercial','Comex','Compras','Ingeniería e Innovación','Ingeniería de Producto','Inyección y Mecanizado','Logística','Mantenimiento Central','Mantenimiento Edilicio','Marketing','Mejora Continua','Planificación','Post Venta','Producto','Producto Comercial','Proyectos','Recursos Humanos','Seguridad Patrimonial','Seguridad, Higiene y Medio Ambiente','Sistemas','Supply Chain','UET 1','UET 2','UET 3','UET 4','UET 5'];
const USERS=[['Camila','Ferraro','Mejora Continua','Administrador'],['Tomás','Beltrán','Mejora Continua','Administrador'],['Lucía','Montenegro','UET 5','Usuario'],['Julián','Sosa','UET 4','Usuario'],['Agustina','Paredes','Calidad Central','Usuario'],['Nicolás','Vidal','UET 2','Usuario'],['Romina','Acosta','Mantenimiento Central','Usuario'],['Federico','Luna','UET 1','Usuario'],['Valeria','Cabrera','Seguridad, Higiene y Medio Ambiente','Usuario'],['Matías','Ibarra','UET 3','Usuario'],['Sofía','Herrera','Ingeniería de Producto','Usuario'],['Gonzalo','Peralta','Logística','Usuario']].map(([n,a,ar,ro])=>({n,a,ar,ro,e:(n[0]+a).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ /g,'')+'@escorial.com.ar'}));
function recalc(r){r.P0=_s(r.lines,l=>l.antes*l.costo);r.ahorroProy=r.P0*(1-r.meta/r.base);r.ahorroReal=r.medido?r.P0*(1-r.actual/r.base):0;}
const TIPOC={'Contención':'#F28C28','Contramedida':'#2E9BD6','Estandarización':'#8E4EC6','Yokoten':'#22A06B'};
const ESTC={'Cerrada':'#22A06B','En curso':'#2E9BD6','Planificada':'#98A2B3','Vencida':'#E5484D'};

/* ============ DATOS DE DEMOSTRACIÓN (simulados) ============ */
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(20261117);const pick=(a,r=R)=>a[Math.floor(r()*a.length)];const btw=(a,b,r=R)=>a+r()*(b-a);
const addD=(d,n)=>new Date(d.getTime()+n*864e5);
const SECT=[];for(const p in ORG)for(const u in ORG[p])for(const s of ORG[p][u])SECT.push({planta:p,uet:u,sector:s});
const RDPS=[];
(function(){
 const W=[2,2,2,2,3,3,4,4,5];const tot=W.reduce((a,b)=>a+b,0);
 for(let i=0;i<30;i++){
  const loc=pick(SECT);const x=R();const herr=x<.35?'5PQ':x<.75?'A4':'A3';
  let y=R()*tot,paso=0;for(let k=0;k<W.length;k++){y-=W[k];if(y<=0){paso=k;break}}
  const durF={'5PQ':.5,'A4':1,'A3':1.8}[herr];
  const inicio=addD(TODAY,-(20+paso*22*durF+R()*30));
  const ind=pick(IND);const base=ind.b*btw(.8,1.25),meta=ind.m*btw(.8,1.2);
  const kL=1+Math.floor(R()*2.4),target=btw(8e6,120e6);
  const lines=Array.from({length:kL},()=>{const std=R()<.75;const c=std?pick(MAT):null,L=std?null:pick(LIBRES);const costo=std?costoAt(c,inicio):L.costo;
   return {mode:std?'std':'libre',cid:std?c.id:null,concepto:std?c.concepto:L.c,unidad:std?c.unidad:L.u,costo,antes:Math.max(1,Math.round(target/kL/costo)),fuente:std?'Matriz de costos':'Costo indirecto estimado'}});
  const P0=_s(lines,l=>l.antes*l.costo);
  const costo=Math.round(P0*btw(.02,.12)*(herr==='A3'?1.6:1)/1000)*1000;
  const frac=[0,0,0,0,0,0,0,.7,.97][paso]*btw(.85,1.08);
  const actual=base-Math.min(1.05,frac)*(base-meta);
  const medido=paso>=7;
  const impacto=medido?addD(TODAY,-(paso===7?btw(8,60):btw(30,120))):null;
  const r={loc,herr,paso,inicio,ind,base,meta,actual,P0,costo,lines,muda:pick(MUDAP),medido,impacto,
   cerrado:paso===8&&R()<.6,titulo:TIT[loc.sector],lider:pick(LIDER),origen:pick(ORIG),crs:[0,1,2].map(()=>pick(CRS)).filter((v,k,a)=>a.indexOf(v)===k)};
  recalc(r);RDPS.push(r);
 }
 RDPS.sort((a,b)=>a.inicio-b.inicio);
 RDPS.forEach((r,i)=>{r.id='RDP-'+String(i+1).padStart(3,'0');r.acc=genAcc(r,i);});
})();
function genAcc(r,i){
 const q=rng(1000+i*77),pk=a=>pick(a,q),bt=(a,b)=>btw(a,b,q);const out=[];let n=1;
 const add=(tipo,txt,ini,comp,av,costo)=>{const est=av>=100?'Cerrada':ini>TODAY&&av===0?'Planificada':comp<TODAY?'Vencida':'En curso';
  out.push({id:'A-'+r.id.slice(-3)+'-'+String(n++).padStart(2,'0'),tipo,txt,cr:tipo==='Contramedida'?'CR'+(1+Math.floor(q()*r.crs.length)):'—',resp:pk(LIDER),ini,comp,av,est,costo:costo||0});};
 if(r.paso>=1){const k=1+Math.floor(q()*2);for(let j=0;j<k;j++){const ini=addD(r.inicio,2+j*2);add('Contención',pk(AC.cont),ini,addD(ini,btw(7,14,q)),r.paso>=3?100:Math.round(bt(40,100)/10)*10);}}
 if(r.paso>=5){const k={'5PQ':2,'A4':3,'A3':5}[r.herr]+Math.floor(q()*2);
  for(let j=0;j<k;j++){let ini,comp,av;
   if(r.paso===5){ini=addD(TODAY,bt(-3,20));comp=addD(ini,bt(15,45));av=0;}

/* ============ CONEXIÓN CON LA API (modo real) / MODO DEMO ============ */
const CFG=window.RDP_CONFIG||{};const LIVE=!!CFG.API_URL;
const BAN=h=>LIVE?'':'<div class="banner">'+h+'</div>';
let CRED={email:'',key:''};
try{CRED=JSON.parse(localStorage.getItem('rdp_cred')||'{}')||{}}catch(e){}
async function api(method,path,body){
 const h={'Content-Type':'application/json'};
 if((CFG.AUTH||'pilot')==='pilot'){h['X-App-Key']=CRED.key||'';h['X-User-Email']=CRED.email||''}
 else if(typeof CFG.getToken==='function'){h['Authorization']='Bearer '+await CFG.getToken()}
 const r=await fetch(CFG.API_URL.replace(/\/$/,'')+path,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body)});
 let j=null;try{j=await r.json()}catch(e){}
 if(!r.ok){const er=new Error((j&&j.error)||('Error '+r.status));er.status=r.status;throw er}
 return j;
}
const uname=e=>{const u=USERS.find(x=>x.e===e);return u?u.n+' '+u.a:(e||'')};
function mapRdp(a){
 const old=RDPS.find(x=>x.id===a.id);
 const r={id:a.id,titulo:a.titulo,loc:{planta:a.planta,uet:a.uet,sector:a.sector},herr:a.herramienta,paso:a.paso,inicio:D(a.inicio),
  ind:{u:a.indicador_unidad||'',b:+a.linea_base,m:+a.meta},base:+a.linea_base,meta:+a.meta,actual:+a.actual,P0:+a.perdida_base,costo:+a.inversion,
  ahorroProy:+a.ahorro_proy,ahorroReal:+a.ahorro_real,medido:a.paso>=7,impacto:a.ultima_medicion?D(a.ultima_medicion):(a.paso>=7?TODAY:null),
  cerrado:a.cerrado,lider:uname(a.lider_email),liderEmail:a.lider_email,origen:a.origen,muda:a.muda,crs:[],justificacion:a.justificacion,
  lines:(a.perdidas||[]).map(p=>({id:p.id,mode:p.modo,cid:p.matriz_id,concepto:p.concepto,unidad:p.unidad,costo:+p.costo_unit,antes:+p.cant_antes,desp:p.cant_despues==null?null:+p.cant_despues,fuente:p.fuente})),
  acc:(a.acciones||[]).map(x=>({id:x.codigo,_id:x.id,tipo:x.tipo,txt:x.texto,cr:x.causa_raiz||'—',resp:uname(x.resp_email),ini:D(x.inicio),comp:D(x.compromiso),av:x.avance,est:x.estado,costo:+x.inversion})),
  pasos:old?old.pasos:{},meds:old?old.meds:[],_det:old?old._det:false};
 return r;
}
function putRdp(a){const r=mapRdp(a),i=RDPS.findIndex(x=>x.id===r.id);if(i>=0)RDPS[i]=r;else RDPS.push(r);return r}
async function loadLive(){
 const bs=await api('GET','/bootstrap');
 UI.me=bs.me;UI.rol=bs.me.rol;
 AREAS.length=0;AREAS.push(...bs.areas);
 USERS.length=0;USERS.push(...bs.usuarios.filter(x=>x.activo).map(x=>({n:x.nombre,a:x.apellido,ar:x.area,ro:x.rol,e:x.email})));
 MAT.length=0;MAT.push(...bs.matriz.filter(x=>x.activo).map(x=>({id:x.id,concepto:x.concepto,unidad:x.unidad,fuente:x.fuente,v:x.versiones.map(v=>({desde:D(v.desde),costo:+v.costo}))})));
 for(const k of Object.keys(ORG))delete ORG[k];
 for(const e of bs.estructura){if(!ORG[e.planta])ORG[e.planta]={};if(!ORG[e.planta][e.uet])ORG[e.planta][e.uet]=[];ORG[e.planta][e.uet].push(e.sector)}
 SECT.length=0;for(const p in ORG)for(const u in ORG[p])for(const s of ORG[p][u])SECT.push({planta:p,uet:u,sector:s});
 const L=await api('GET','/rdp');RDPS.length=0;L.forEach(a=>RDPS.push(mapRdp(a)));
 UI.sel=RDPS.length?RDPS[0].id:null;
}
async function loadDetail(r){
 try{const d=await api('GET','/rdp/'+r.id);r.pasos={};(d.pasos||[]).forEach(p=>r.pasos[p.paso]=p.datos);r.meds=d.mediciones||[];r._det=true;if(UI.tab==='ficha'&&UI.sel===r.id)renderFicha()}catch(e){toast(e.message)}
}
function loginView(msg){

async function doLogin(){
 CRED={email:$('#lg_e').value.trim().toLowerCase(),key:$('#lg_k').value};
 try{localStorage.setItem('rdp_cred',JSON.stringify(CRED))}catch(e){}
 boot();
}
function logout(){CRED={email:'',key:''};try{localStorage.removeItem('rdp_cred')}catch(e){}boot()}
async function boot(){
 if(!LIVE){render();return}
 if((CFG.AUTH||'pilot')==='pilot'&&(!CRED.email||!CRED.key)){loginView();return}
 try{await loadLive();const hm=(location.hash||'').match(/rdp=([A-Z0-9-]+)/);if(hm&&RDPS.find(x=>x.id===hm[1])){UI.sel=hm[1];UI.tab='ficha'}render()}catch(e){loginView(e.status===401||e.status===403?e.message:'No se pudo conectar con la API: '+e.message)}
}

/* ============ CALCULADORA (cantidades medidas si existen) ============ */
function calcCard(r){
 const meas=r.lines.length&&r.lines.every(l=>l.desp!=null),k=r.actual/(r.base||1);
 const ln=r.lines.map(l=>{const a=l.antes*l.costo;const dq=!r.medido?null:meas?l.desp:l.antes*k;return {l,a,dq,d:dq==null?null:dq*l.costo}});
 const antes=_s(ln,x=>x.a),desR=r.medido?_s(ln,x=>x.d):null;
 const std=_s(r.lines.filter(l=>l.mode==='std'),l=>l.antes*l.costo)/(antes||1)*100;
 const pay=r.ahorroReal>0?r.costo/r.ahorroReal*12:null;
 const nt=!r.medido?['','El ahorro realizado se calcula al llegar al paso 7 (Monitorear), con la medición del indicador.']:r.ahorroReal>r.costo?['ok','Se recupera la inversión de '+fmtK(r.costo)+' en '+pay.toFixed(1).replace('.',',')+' meses.']:['w','Todavía no se recupera la inversión de '+fmtK(r.costo)+'.'];
 return `<div class="card"><h3>Calculadora de impacto · antes y después <small>valores anualizados</small><button class="btn alt" style="margin-left:auto" onclick="openPL('${r.id}')">+ Pérdida</button></h3>
 <div class="cols2"><div class="tw"><table><thead><tr><th>Tipo</th><th>Concepto</th><th>Un.</th><th class="r">Pérd. unit.</th><th class="r">Cant. antes</th><th class="r">Antes</th><th class="r">Cant. después</th><th class="r">Después</th><th class="r">Ahorro</th></tr></thead><tbody>
 ${ln.map(({l,a,dq,d})=>`<tr><td>${tag(l.mode==='std'?'Estándar':'Libre',l.mode==='std'?'#2E9BD6':'#F28C28')}</td><td title="${esc2(l.mode==='std'?'Matriz de costos':l.fuente)}">${l.concepto}</td><td>${l.unidad}</td><td class="r nw">${fmtUS(l.costo)}</td><td class="r">${fv(l.antes)}</td><td class="r nw">${fmtK(a)}</td><td class="r">${dq!=null?fv(dq):'—'}</td><td class="r nw">${d!=null?fmtK(d):'—'}</td><td class="r nw"><b>${d!=null?fmtK(a-d):'—'}</b></td></tr>`).join('')||'<tr><td colspan="9" class="mut">Todavía no cargaste pérdidas.</td></tr>'}
 </tbody><tfoot><tr class="tfoot"><td colspan="5" class="r">Total</td><td class="r nw">${fmtK(antes)}</td><td></td><td class="r nw">${desR!==null?fmtK(desR):'—'}</td><td class="r nw">${desR!==null?fmtK(antes-desR):'—'}</td></tr></tfoot></table>
 <div class="note ${nt[0]}">${nt[1]}</div>
 <div class="note">${std.toFixed(0)}% de la pérdida base proviene de valores estándar de la matriz; el resto son conceptos libres (p. ej. costos indirectos).${meas?' Las cantidades «después» son valores medidos.':''}</div></div>
 <div><div class="ch" style="height:260px"><canvas id="c8"></canvas></div></div></div></div>`;
}
function drawBA(r){
 const meas=r.lines.length&&r.lines.every(l=>l.desp!=null),k=r.actual/(r.base||1);
 const antes=_s(r.lines,l=>l.antes*l.costo),L=['Antes','Meta'],V=[antes,antes*r.meta/(r.base||1)],C=['#E5484D','#2E9BD6'];
 if(r.medido){L.splice(1,0,'Después (real)');V.splice(1,0,meas?_s(r.lines,l=>l.desp*l.costo):antes*k);C.splice(1,0,'#22A06B')}
 mk('c8',{type:'bar',data:{labels:L,datasets:[{data:V,backgroundColor:C,borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fmtK(c.raw)}}},scales:{y:{beginAtZero:true,ticks:{callback:v=>fmtK(v)}}}}});
}

 const so=(k,list)=>`<select onchange="P0.${k}=this.value;renderP0()">${list.map(([v,l])=>`<option value="${v}" ${String(P0[k])===String(v)?'selected':''}>${l}</option>`).join('')}</select>`;
 const yn=k=>so(k,[['Sí','Sí'],['No','No']]);
 const crit=['Seguridad · ¿afecta a las personas?','Severidad · ¿afecta al cliente?','Cantidad · ¿está en el Pareto?','Recurrencia · ¿sucede continuamente?'];
 const orig={'Indicador':['Nombre del indicador','Valor actual','Meta'],'Pareto':['Categoría del Pareto','% del total','Período'],'Impacto (seguridad/cliente)':['Tipo de impacto','Descripción','Evidencia'],'Genba':['Sector observado','Hallazgo','Fecha de la recorrida'],'Reclamo de cliente':['N° de reclamo','Cliente','Cantidad']};
 const kz=P0.exs==='No'?['w','Sin estándar no hay punto de comparación: primero hay que crear uno (paso 1C). Esto todavía no es un RDP.']:P0.cum==='No'?['w','Existe el estándar pero no se cumple: el incumplimiento es parte del problema. Se puede avanzar, registrándolo en el paso 1.']:P0.est==='No'?['w','El proceso no es estable: conviene estabilizarlo antes de aplicar RDP (el Kaizen solo ocurre sobre procesos estables).']:['ok','Hay estándar, se cumple y el proceso es estable: el problema es candidato a RDP.'];
 $('#view').innerHTML=`
 ${BAN(`<b>Muestra del Paso 0.</b> Los campos son orientativos; en la versión real se guardan en la base y alimentan el RDP.`)}
 <div class="card"><h3>Paso 0 · Selección y priorización del problema</h3>
  <div class="form"><div class="f2"><label class="lab">Problema (título)</label><input type="text" placeholder="Ej.: scrap en línea X" value="${esc2(F0.titulo)}" oninput="F0.titulo=this.value"></div>
  <div class="f2"><label class="lab">Planta</label><select onchange="F0.planta=this.value;F0.uet='';F0.sector='';renderP0()">${pls.map(x=>`<option ${x===F0.planta?'selected':''}>${x}</option>`).join('')}</select></div>
  <div class="f2"><label class="lab">UET</label><select onchange="F0.uet=this.value;F0.sector='';renderP0()">${uets.map(x=>`<option ${x===F0.uet?'selected':''}>${x}</option>`).join('')}</select></div>
  <div class="f2"><label class="lab">Sector</label><select onchange="F0.sector=this.value">${secs.map(x=>`<option ${x===F0.sector?'selected':''}>${x}</option>`).join('')}</select></div>
  <div class="f2"><label class="lab">Líder del RDP</label><select onchange="F0.lider=this.value">${USERS.map(u=>`<option value="${u.e}" ${u.e===F0.lider?'selected':''}>${u.n} ${u.a}</option>`).join('')}</select></div>
  <div class="f2"><label class="lab">Tipo de pérdida (muda)</label><select onchange="F0.muda=this.value">${MUDAS.map(m=>`<option ${m===F0.muda?'selected':''}>${m}</option>`).join('')}</select></div></div>
  <div class="form" style="margin-top:10px"><div class="f2"><label class="lab">Indicador (unidad)</label><input type="text" placeholder="% scrap, min parada/turno…" value="${esc2(F0.unidad)}" oninput="F0.unidad=this.value"></div>
  <div class="f2"><label class="lab">Línea base</label><input type="number" step="any" value="${F0.base}" oninput="F0.base=this.value"></div>
  <div class="f2"><label class="lab">Meta</label><input type="number" step="any" value="${F0.meta}" oninput="F0.meta=this.value"></div></div></div>
 <div class="card"><h3>¿De dónde viene el problema? <small>origen y dato de respaldo</small></h3>
  <div class="form"><div class="f2"><label class="lab">Origen</label>${so('orig',ORIG.map(x=>[x,x]))}</div>
  ${(orig[P0.orig]||[]).map(l=>`<div class="f2"><label class="lab">${l}</label><input type="text" value="${esc2(F0.det[l]||'')}" oninput="F0.det['${l}']=this.value"></div>`).join('')}
  </div>
  <div style="margin-top:12px" class="form"><div class="f2"><label class="lab">¿Existe un estándar?</label>${yn('exs')}</div><div class="f2"><label class="lab">¿Se sigue?</label>${yn('cum')}</div><div class="f2"><label class="lab">¿Proceso estable?</label>${yn('est')}</div></div>
  <div class="note ${kz[0]}">${kz[1]}</div></div>
 <div class="card"><h3>Pérdida anual estimada <small>el valor «antes» que se compara al cierre</small><button class="btn alt" style="margin-left:auto" onclick="openPL('p0')">+ Pérdida</button></h3>
  <div class="tw"><table><thead><tr><th>Tipo</th><th>Concepto</th><th>Un.</th><th class="r">Pérdida unitaria</th><th class="r">Cantidad anual</th><th class="r">Pérdida total</th></tr></thead><tbody>${P0.lines.map(l=>`<tr><td>${tag(l.mode==='std'?'Estándar':'Libre',l.mode==='std'?'#2E9BD6':'#F28C28')}</td><td>${l.concepto}</td><td>${l.unidad}</td><td class="r">${fmtUS(l.costo)}</td><td class="r">${fv(l.antes)}</td><td class="r"><b>${fmtUS(l.antes*l.costo)}</b></td></tr>`).join('')||'<tr><td colspan="6" class="mut">Todavía no cargaste pérdidas.</td></tr>'}</tbody><tfoot><tr class="tfoot"><td colspan="5" class="r">Pérdida anual total</td><td class="r">${fmtUS(_s(P0.lines,l=>l.antes*l.costo))}</td></tr></tfoot></table></div>
  <div class="note">Usá <b>valores estándar</b> de la matriz de costos o un <b>concepto libre</b> (p. ej. costos indirectos que la matriz no contempla). Los libres quedan marcados como tales en el cálculo.</div></div>
 <div class="card"><h3>Priorización <small>criterios del taller de RDP · decide el equipo por consenso</small></h3>
  <div class="form">${crit.map((c,i)=>`<div class="f2"><label class="lab">${c}</label><select onchange="P0.s[${i}]=+this.value;renderP0()">${[1,2,3,4,5].map(v=>`<option ${P0.s[i]===v?'selected':''}>${v}</option>`).join('')}</select></div>`).join('')}
  <div class="f2"><label class="lab">Puntaje total</label><div class="tot">${tot} <span class="mut" style="font-size:14px">/ 20</span></div><div class="pb" style="height:10px"><div style="width:${tot/20*100}%;background:${tot>=15?'#E5484D':tot>=10?'#F2A93B':'#2E9BD6'}"></div></div></div></div></div>
 <div class="card"><h3>Elegí el modelo de resolución de problemas <small>la recomendación es una guía: la decisión es tuya</small></h3>
  <div class="form" style="margin-bottom:12px"><div class="f2"><label class="lab">Causa raíz</label>${so('causa',[[0,'Conocida / probable'],[1,'A investigar'],[2,'Multicausal / desconocida']])}</div>
  <div class="f2"><label class="lab">Alcance</label>${so('alc',[[0,'Un sector'],[1,'Una UET'],[2,'Varias UET o plantas']])}</div>
  <div class="f2"><label class="lab">¿Requiere inversión?</label>${so('inv',[[0,'No'],[1,'Sí']])}</div>
  <div class="f2"><label class="lab">Antigüedad</label>${so('cro',[[0,'Puntual / reciente'],[1,'Crónico / recurrente']])}</div></div>
  <div class="tools">${TOOLS.map(t=>`<div class="tool ${sel===t.k?'sel':''}" onclick="P0.tool='${t.k}';renderP0()">${rec.k===t.k?'<span class="rec">★ Recomendado</span>':''}<h4>${t.n}</h4><div>${tag(t.f,HC[t.k])} <span class="mut">${t.t} (referencia)</span></div><p>${t.d}</p><p class="mut"><i>${t.e}</i></p></div>`).join('')}</div>
  <div class="note">Complejidad ${rec.s}/6 → se recomienda <b>${HN[rec.k]}</b>. Elegiste <b>${HN[sel]}</b>.</div>
  ${sel!==rec.k?`<div class="f2" style="margin-top:10px"><label class="lab">Elegiste distinto de lo recomendado: ¿por qué?</label><textarea rows="2" placeholder="Justificación (queda registrada en el RDP)" oninput="P0.just=this.value">${P0.just}</textarea></div>`:''}
  <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap"><button class="btn" onclick="createRdp()">Crear RDP</button><button class="btn ghost" onclick="toast('En la muestra no se guardan datos')">Guardar borrador</button></div></div>`;
}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}

/* ============ NAVEGACIÓN ============ */
function render(){
 const T=[['dash','Dashboard'],['ficha','Ficha del RDP'],['p0','Nuevo RDP · Paso 0']];if(UI.rol==='Administrador')T.push(['adm','Administración']);
 if(UI.tab==='adm'&&UI.rol!=='Administrador')UI.tab='dash';
 $('#tabs').innerHTML=T.map(([k,l])=>`<button class="${UI.tab===k?'on':''}" onclick="UI.tab='${k}';render()">${l}</button>`).join('')+whoHTML();
 UI.tab==='dash'?renderDash():UI.tab==='ficha'?renderFicha():UI.tab==='p0'?renderP0():renderAdm();
}
boot();
</script>
</body>
</html>
